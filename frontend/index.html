<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Live Broadcasting</title>
</head>

<body>

  <h1>Live Broadcasting</h1>

  <!-- =========================
       LIVE ROOMS
  ========================== -->

  <section id="liveRooms">

    <h2>🔴 Live Now</h2>

    <div id="liveRoomsList">
      <p>Loading live broadcasts...</p>
    </div>

  </section>


  <hr>


  <!-- =========================
       BROADCASTER
  ========================== -->

  <section id="broadcaster">

    <h2>Start Broadcasting</h2>

    <button
      id="goLive"
      disabled
    >
      Go Live
    </button>

    <h3>My Camera</h3>

    <video
      id="localVideo"
      autoplay
      muted
      playsinline
      width="640"
      height="360"
    ></video>

  </section>


  <hr>


  <!-- =========================
       VIEWER
  ========================== -->

  <section id="viewer">

    <h2>Live Stream</h2>

    <video
      id="remoteVideo"
      autoplay
      playsinline
      controls
      width="640"
      height="360"
    ></video>

  </section>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    type="module"
    src="/src/client.js"
  ></script>

</body>
</html>
